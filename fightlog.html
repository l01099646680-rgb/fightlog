<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIGHT LOG · 격투기 훈련 일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b;
  --bg-2: #18181b;
  --border: #27272a;
  --text: #f4f4f5;
  --text-dim: #a1a1aa;
  --text-dimmer: #71717a;
  --accent: #dc2626;
  --accent-bright: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 18px; }
@media (min-width: 1280px) { html { font-size: 19px; } }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.font-display { font-family: 'Bebas Neue', 'Noto Sans KR', sans-serif; letter-spacing: 0.05em; }
.font-mono { font-family: 'JetBrains Mono', monospace; }
.container { max-width: 88rem; margin: 0 auto; padding: 2rem 1rem; }
@media (min-width: 640px) { .container { padding: 2rem 1.5rem; } }
@media (min-width: 1280px) { .container { padding: 2.5rem 2.5rem; } }

.header {
  border-bottom: 1px solid var(--border);
  padding-bottom: 1.5rem;
  margin-bottom: 2rem;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
}
.header-title { display: flex; align-items: center; gap: 0.75rem; }
.header-bar { width: 6px; height: 2.5rem; background: var(--accent); }
.header-title h1 { font-family: 'Bebas Neue', sans-serif; font-size: 3.25rem; letter-spacing: 0.05em; line-height: 1; }
@media (min-width: 640px) { .header-title h1 { font-size: 3.75rem; } }
.header-subtitle { color: var(--text-dim); margin-top: 0.5rem; margin-left: 1.25rem; font-size: 0.875rem; }

.btn-primary {
  background: var(--accent); color: white; border: none;
  padding: 0.75rem 1.5rem; font-family: 'Bebas Neue', sans-serif;
  font-size: 1.25rem; letter-spacing: 0.1em; cursor: pointer; transition: background 0.15s;
}
.btn-primary:hover { background: var(--accent-bright); }
.btn-ghost {
  background: transparent; color: var(--text-dim);
  border: 1px solid var(--border); padding: 0.75rem 1.5rem;
  cursor: pointer; font-family: 'Noto Sans KR', sans-serif; transition: all 0.15s;
}
.btn-ghost:hover { color: var(--text); border-color: #52525b; }

.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 2.5rem; }
.stats > :nth-child(5) { grid-column: span 2; }
@media (min-width: 768px) { .stats { grid-template-columns: repeat(5, 1fr); } .stats > :nth-child(5) { grid-column: auto; } }
.stat-card { border: 1px solid var(--border); background: rgba(24,24,27,0.4); padding: 1rem; }
.stat-card.accent { border-color: rgba(220,38,38,0.4); background: rgba(127,29,29,0.2); }
.stat-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
.stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; margin-top: 0.5rem; display: flex; align-items: baseline; gap: 0.25rem; }
.stat-card.accent .stat-value { color: var(--accent-bright); }
.stat-suffix { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-dimmer); }

.monthly { margin-bottom: 2.5rem; }
.monthly-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; user-select: none; }
.monthly-header h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.05em; }
.monthly-chevron { color: var(--text-dimmer); transition: transform 0.2s; font-size: 0.75rem; }
.monthly.collapsed .monthly-chevron { transform: rotate(-90deg); }
.monthly.collapsed .monthly-body { display: none; }
.month-grid { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
.month-card { border: 1px solid var(--border); background: rgba(24,24,27,0.3); padding: 1rem 1.25rem; }
.month-card-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.875rem; }
.month-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.03em; }
.month-sessions { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--text-dim); }
.month-metrics { display: flex; flex-wrap: wrap; gap: 1rem 2rem; }
.month-metric-label { font-size: 0.7rem; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 0.05em; }
.month-metric-value { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; margin-top: 0.125rem; color: var(--text); }
.month-metric-value .unit { font-size: 0.7rem; color: var(--text-dimmer); }

.view-toggle { display: inline-flex; border: 1px solid var(--border); margin-bottom: 1.5rem; }
.view-btn { background: transparent; border: none; color: var(--text-dim); padding: 0.5rem 1.25rem; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; font-size: 0.875rem; transition: all 0.15s; }
.view-btn.active { background: var(--text); color: var(--bg); }

.calendar { margin-bottom: 1.5rem; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; max-width: 46rem; margin-left: auto; margin-right: auto; }
.cal-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.03em; }
.cal-nav-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); width: 2.25rem; height: 2.25rem; cursor: pointer; font-size: 1.1rem; transition: all 0.15s; }
.cal-nav-btn:hover { color: var(--text); border-color: #52525b; }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem; margin-bottom: 0.25rem; max-width: 46rem; margin-left: auto; margin-right: auto; }
.cal-weekdays span { text-align: center; font-size: 0.7rem; color: var(--text-dimmer); padding: 0.25rem 0; }
.cal-sun { color: #f87171 !important; }
.cal-sat { color: #60a5fa !important; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem; max-width: 46rem; margin: 0 auto; }
.cal-cell { aspect-ratio: 1; border: 1px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--text-dimmer); position: relative; }
.cal-cell.has-entry { border-color: var(--border); background: rgba(24,24,27,0.6); cursor: pointer; color: var(--text); }
.cal-cell.has-entry:hover { background: rgba(39,39,42,0.9); border-color: #52525b; }
.cal-cell.today { border-color: var(--accent); }
.cal-dots { display: flex; gap: 2px; position: absolute; bottom: 5px; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; margin-top: 1.25rem; justify-content: center; }
.cal-legend-item { display: flex; align-items: center; gap: 0.375rem; font-size: 0.7rem; color: var(--text-dim); }

.filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
.filter-chip {
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  padding: 0.375rem 0.75rem; font-size: 0.875rem; cursor: pointer;
  display: flex; align-items: center; gap: 0.5rem; transition: all 0.15s;
  font-family: 'Noto Sans KR', sans-serif;
}
.filter-chip:hover { color: var(--text); }
.filter-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.filter-dot { width: 0.5rem; height: 0.5rem; display: inline-block; }

.entries { list-style: none; display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
@media (min-width: 1100px) { .entries { grid-template-columns: repeat(2, 1fr); } }
.entry { border: 1px solid var(--border); background: rgba(24,24,27,0.3); display: flex; transition: background 0.15s; }
.entry:hover { background: rgba(24,24,27,0.6); }
.entry-date { width: 5rem; border-right: 1px solid var(--border); background: rgba(9,9,11,0.5); padding: 1rem; text-align: center; flex-shrink: 0; }
@media (min-width: 640px) { .entry-date { width: 6rem; } }
.entry-date-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.875rem; }
.entry-date-day { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-dimmer); margin-top: 0.25rem; }
.entry-content { flex: 1; padding: 1rem; min-width: 0; }
.entry-meta { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
.type-badge { color: white; font-size: 0.75rem; padding: 0.125rem 0.5rem; }
.entry-stats { margin-left: auto; display: flex; gap: 0.75rem; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: var(--text-dim); }
.entry-stats span span { color: var(--text); }
.entry-tech, .entry-reflection { font-size: 0.875rem; word-break: break-word; white-space: pre-wrap; }
.entry-tech { color: #e4e4e7; margin-bottom: 0.375rem; }
.entry-reflection { color: var(--text-dim); font-style: italic; }

.entry-detail { overflow: hidden; max-height: 0; transition: max-height 0.25s ease; }
.entry-detail.open { max-height: 2000px; }
.entry-toggle { font-size: 0.7rem; color: var(--text-dimmer); cursor: pointer; margin-top: 0.35rem; user-select: none; display: inline-block; }
.entry-toggle:hover { color: var(--text); }
.entry-actions { display: flex; flex-direction: column; border-left: 1px solid var(--border); opacity: 0; transition: opacity 0.15s; }
.entry:hover .entry-actions { opacity: 1; }
.entry-action-btn { background: transparent; border: none; color: var(--text-dim); padding: 0 0.75rem; font-size: 0.75rem; cursor: pointer; flex: 1; transition: all 0.15s; font-family: 'Noto Sans KR', sans-serif; }
.entry-action-btn:hover { background: #27272a; color: var(--text); }
.entry-action-btn.delete { border-top: 1px solid var(--border); }
.entry-action-btn.delete:hover { background: #450a0a; color: #f87171; }
@media (max-width: 640px) { .entry-actions { opacity: 1; } }

.empty { border: 1px dashed var(--border); padding: 3rem 1rem; text-align: center; }
.empty-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.875rem; color: var(--text-dimmer); margin-bottom: 0.5rem; }
.empty-text { font-size: 0.875rem; color: var(--text-dim); margin-bottom: 1.5rem; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 1rem; overflow-y: auto; }
@media (min-width: 640px) { .modal-overlay { align-items: center; } }
.modal { background: var(--bg); border: 1px solid var(--border); max-width: 46rem; width: 100%; padding: 1.5rem; margin: 2rem 0; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
.modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.875rem; }
.modal-close { background: transparent; border: none; color: var(--text-dimmer); font-size: 1.5rem; cursor: pointer; line-height: 1; }
.modal-close:hover { color: var(--text); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.25rem; }
.field { margin-bottom: 1.25rem; }
.field-label { display: block; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.375rem; }
.field input, .field textarea { width: 100%; background: var(--bg-2); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.75rem; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }
.field textarea { font-family: 'Noto Sans KR', sans-serif; resize: vertical; min-height: 80px; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }

.type-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; }
@media (max-width: 480px) { .type-grid { grid-template-columns: repeat(3, 1fr); } }
.type-btn { background: var(--bg-2); border: 1px solid var(--border); color: var(--text-dim); padding: 0.5rem 0.25rem; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; font-family: 'Noto Sans KR', sans-serif; word-break: keep-all; line-height: 1.2; }
.type-btn:hover { color: var(--text); }
.type-btn.active { color: white; border-color: transparent; }

.slider-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem; }
.slider-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.375rem; }
.slider-value { font-family: 'JetBrains Mono', monospace; }
.slider-value-num { font-size: 1.5rem; }
.slider-value-suffix { color: var(--text-dimmer); font-size: 0.75rem; }
.field input[type="range"] { width: 100%; accent-color: var(--accent); background: transparent; border: none; padding: 0; }
.slider-hint { font-size: 0.75rem; color: var(--text-dimmer); margin-top: 0.25rem; }
.slider-ends { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-dimmer); margin-top: 0.375rem; font-family: 'Noto Sans KR', sans-serif; }
.slider-ends .end-low { color: #71717a; }
.slider-ends .end-high { color: #a1a1aa; }
.modal-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
.modal-actions .btn-primary { flex: 1; }

.hidden { display: none !important; }

.footer { margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid #18181b; color: var(--text-dimmer); font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
.footer-actions { display: flex; gap: 0.75rem; }
.footer-link { background: transparent; border: none; color: var(--text-dimmer); cursor: pointer; font-size: 0.75rem; text-decoration: underline; font-family: 'Noto Sans KR', sans-serif; }
.footer-link:hover { color: var(--text-dim); }

.type-technique { background: #3f3f46; }
.type-mma-sparring { background: #dc2626; }
.type-grappling { background: #4338ca; }
.type-conditioning { background: #d97706; }
.type-flexibility { background: #047857; }
.class-strike { background: #ea580c; }
.class-grap { background: #2563eb; }
.class-mma { background: #7c3aed; }
.class-sparring { background: #dc2626; }
.mode-full { background: #b91c1c; }
.mode-situational { background: #57534e; }

.sync-status { margin-top: 0.6rem; font-size: 0.75rem; color: var(--text-dimmer); text-align: right; min-height: 1rem; }
.sync-status.ok { color: #4ade80; }
.sync-status.err { color: #f87171; }
.sync-status.busy { color: var(--accent-bright); }
.sync-panel { margin-top: 0.75rem; border: 1px solid var(--border); padding: 1.1rem 1rem; background: rgba(24,24,27,0.4); }
.sync-panel.hidden { display: none; }
.sync-panel-actions { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; }
.sync-hint { margin-top: 0.75rem; font-size: 0.72rem; color: var(--text-dimmer); line-height: 1.5; }
.class-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
@media (max-width: 480px) { .class-grid { grid-template-columns: repeat(2, 1fr); } }

.fortune-card { border: 1px solid var(--border); background: rgba(24,24,27,0.4); margin-bottom: 1.5rem; position: relative; overflow: hidden; }
.fortune-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background: var(--accent); }
.fortune-head { display:flex; align-items:center; justify-content:space-between; padding: 1rem 1.25rem; border-bottom: 1px dashed var(--border); }
.fortune-label { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dimmer); }
.fortune-catbadge { display:flex; align-items:center; gap: 0.5rem; }
.fortune-code { font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.08em; background: var(--accent); color:#fff; padding: 0.15rem 0.5rem; }
.fortune-kr { font-size: 0.85rem; font-weight: 700; color: var(--text); }
.fortune-body { padding: 1.5rem 1.25rem 1.25rem; }
.fortune-eyebrow { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-bright); margin-bottom: 0.5rem; }
.fortune-move { font-family:'Bebas Neue',sans-serif; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: 0.03em; line-height: 1; color: var(--text); }
.fortune-focus { margin-top: 0.75rem; font-size: 0.95rem; line-height: 1.55; color: var(--text-dim); }
.fortune-focus b { color: var(--text); }
.fortune-watchbox { margin-top: 1.1rem; background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-left: 3px solid #d97706; padding: 0.85rem 1rem; }
.fortune-wt { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: #d97706; margin-bottom: 0.35rem; }
.fortune-wc { font-size: 0.9rem; color: var(--text); line-height: 1.5; }
.fortune-actions { display:flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.35rem; }
.fortune-actions .btn-primary, .fortune-actions .btn-ghost { padding: 0.65rem 1.1rem; font-size: 0.85rem; letter-spacing: 0.02em; }
.fortune-cats { display:flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
.fortune-stats-row { display:grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem; }
.fortune-log { border: 1px solid var(--border); }
.fortune-log-row { display:flex; flex-direction:column; gap: 0.2rem; padding: 0.65rem 0.9rem; border-bottom: 1px solid var(--border); font-size: 0.8rem; cursor: pointer; transition: background 0.12s; }
.fortune-log-row:hover { background: rgba(39,39,42,0.6); }
.fortune-log-row:last-child { border-bottom: none; }
.fortune-log-row .fl-top { display:flex; align-items:center; gap: 0.75rem; }
.fortune-log-row .fl-date { font-family:'JetBrains Mono',monospace; color: var(--text-dimmer); width: 3.2rem; flex-shrink:0; }
.fortune-log-row .fl-code { font-family:'JetBrains Mono',monospace; font-size: 0.7rem; color: var(--accent-bright); width: 2.2rem; flex-shrink:0; }
.fortune-log-row .fl-name { color: var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fortune-log-row .fl-link { margin-left: 3.2rem; font-size: 0.75rem; }
.fortune-log-row .fl-link a { color: var(--accent-bright); text-decoration: none; }
.fortune-log-row .fl-link a:hover { text-decoration: underline; }
.fortune-log-row .fl-memo { margin-left: 3.2rem; font-size: 0.75rem; color: var(--text-dim); font-style: italic; white-space: pre-wrap; }

.field select { width:100%; background: var(--bg-2); border:1px solid var(--border); color: var(--text); padding: 0.5rem 0.75rem; font-family:'Noto Sans KR',sans-serif; font-size: 0.9rem; }
.fortune-backfill { margin-top: 1rem; border: 1px solid var(--border); }
.fortune-backfill-toggle { display:flex; align-items:center; justify-content:space-between; padding: 0.85rem 1rem; cursor:pointer; user-select:none; font-size:0.85rem; color: var(--text-dim); }
.fortune-backfill-toggle:hover { color: var(--text); }
.fortune-backfill-body { padding: 0 1rem 1.25rem; border-top: 1px solid var(--border); padding-top: 1.1rem; }
.fortune-backfill-body.hidden { display:none; }
#f-backfill-chevron.open { transform: rotate(180deg); }
.fortune-log-empty { padding: 1.25rem 1rem; text-align:center; color: var(--text-dimmer); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div>
      <div class="header-title">
        <div class="header-bar"></div>
        <h1>FIGHT LOG</h1>
      </div>
      <p class="header-subtitle">단어알지? 싸워! 매일 도장 나가서 매 순간순간순간마다 싸워! 난 그거 여러분 볼거야!</p>
    </div>
    <button class="btn-primary" id="add-btn">+ 오늘 기록</button>
  </header>

  <section class="stats" id="stats"></section>

  <section class="monthly" id="monthly" style="display:none">
    <div class="monthly-header" id="monthly-toggle">
      <h2>월별 추이</h2>
      <span class="monthly-chevron">▼</span>
    </div>
    <div class="monthly-body" id="monthly-body"></div>
  </section>

  <div class="view-toggle">
    <button class="view-btn active" data-view="list">리스트</button>
    <button class="view-btn" data-view="calendar">달력</button>
    <button class="view-btn" data-view="fortune">오늘의 수련</button>
  </div>

  <div class="calendar" id="calendar" style="display:none">
    <div class="cal-header">
      <button class="cal-nav-btn" id="cal-prev">‹</button>
      <span class="cal-title" id="cal-title"></span>
      <button class="cal-nav-btn" id="cal-next">›</button>
    </div>
    <div class="cal-weekdays">
      <span class="cal-sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="cal-sat">토</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-legend" id="cal-legend"></div>
  </div>

  <div class="fortune-view" id="fortune-view" style="display:none">
    <div class="fortune-card">

let fState = { cats: Object.keys(F_CATS), history: [], today: null };
function fGenId() { return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fLoad() {
  try { const s = JSON.parse(localStorage.getItem(FORTUNE_KEY)) || {}; fState = { cats: (s.cats||Object.keys(F_CATS)).filter(c=>F_CATS[c]), history: s.history||[], today: s.today||null }; if(!fState.cats.length) fState.cats = Object.keys(F_CATS); }
  catch(e) { fState = { cats: Object.keys(F_CATS), history: [], today: null }; }
  let migrated = false;
  fState.history = fState.history.map(h => { if (!h.id || !h.updated) { migrated = true; return { ...h, id: h.id || fGenId(), updated: h.updated || 1 }; } return h; });
  if (migrated) fSave();
}
function fSave() {
  localStorage.setItem(FORTUNE_KEY, JSON.stringify(fState));
  localStorage.setItem("mma:fortune:at", String(Date.now()));
  if (typeof syncSoon === "function") syncSoon();
}
function fTodayKey() { return todayStr(); }
function fSeedIndex(seedStr, len) { let h=2166136261; for(let i=0;i<seedStr.length;i++){ h^=seedStr.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0)%len; }
function fPool() { const p = F_POOL.filter(m => fState.cats.includes(m.cat)); return p.length ? p : F_POOL; }
function fEnsureToday(reroll) {
  const tk = fTodayKey();
  const valid = fState.today && fState.today.move && F_CATS[fState.today.move.cat];
  if (!reroll && fState.today && fState.today.date === tk && valid) return;
  const pool = fPool();
  const idx = reroll ? Math.floor(Math.random()*pool.length) : fSeedIndex(tk+"|"+fState.cats.join(""), pool.length);
  fState.today = { date: tk, move: pool[idx], done: false };
  fSave();
}
function renderFortuneCard() {
  const m = fState.today.move;
  $("#f-cat-code").textContent = m.cat;
  $("#f-cat-kr").textContent = F_CATS[m.cat].kr;
  $("#f-move-name").textContent = m.name;
  $("#f-move-focus").innerHTML = m.focus;
  $("#f-move-watch").textContent = m.watch;
  const db = $("#f-btn-done");
  db.textContent = fState.today.done ? "완료됨" : "오늘 수련 완료";
}
function renderFortuneCats() {
  $("#fortune-cats").innerHTML = Object.keys(F_CATS).map(code => {
    const on = fState.cats.includes(code);
    return `<button class="filter-chip ${on?'active':''}" data-fcat="${code}"><span class="filter-dot" style="background:${on?'var(--bg)':'var(--text-dimmer)'}"></span>${code} · ${F_CATS[code].kr}</button>`;
  }).join("");
  $$("#fortune-cats .filter-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      const code = btn.dataset.fcat;
      const i = fState.cats.indexOf(code);
      if (i >= 0) { if (fState.cats.length > 1) fState.cats.splice(i,1); }
      else fState.cats.push(code);
      fSave();
      renderFortuneCats();
    });
  });
}
function renderFortuneStats() {
  const hist = fState.history;
  $("#f-stat-total").textContent = hist.length;
  const days = [...new Set(hist.map(h=>h.date))].sort().reverse();
  let streak = 0;
  if (days.length) {
    let cur = new Date(fTodayKey());
    const has = new Set(days);
    const tk = fTodayKey();
    if (!has.has(tk)) cur.setDate(cur.getDate()-1);
    while (true) {
      const k = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}-${String(cur.getDate()).padStart(2,"0")}`;
      if (has.has(k)) { streak++; cur.setDate(cur.getDate()-1); } else break;
    }
  }
  $("#f-stat-streak").textContent = streak;
}
function renderFortuneLog() {
  const hist = [...fState.history].reverse().slice(0,8);
  if (!hist.length) { $("#fortune-log").innerHTML = `<div class="fortune-log-empty">아직 완료한 수련이 없어요.</div>`; return; }
  $("#fortune-log").innerHTML = hist.map(h => {
    const md = h.date.slice(5).replace("-","/");
    const linkHtml = h.link ? `<div class="fl-link">▶ <a href="${escapeHtml(h.link)}" target="_blank" rel="noopener">${escapeHtml(h.link)}</a></div>` : "";
    const memoHtml = h.memo ? `<div class="fl-memo">— ${escapeHtml(h.memo)}</div>` : "";
    return `<div class="fortune-log-row" data-id="${h.id}"><div class="fl-top"><span class="fl-date">${md}</span><span class="fl-code">${h.cat}</span><span class="fl-name">${escapeHtml(h.name)}</span></div>${linkHtml}${memoHtml}</div>`;
  }).join("");
  $$("#fortune-log .fortune-log-row").forEach(row => {
    row.addEventListener("click", (e) => {
      if (e.target.tagName === "A") return; // 링크 클릭은 그대로 이동
      fOpenEntryForm(row.dataset.id);
    });
  });
}
function renderFortune() {
  fEnsureToday(false);
  renderFortuneCard();
  renderFortuneCats();
  renderFortuneStats();
  renderFortuneLog();
  fPopulateBackfillCats();
}
let fEditingId = null;
function fPopulateBackfillCats() {
  const sel = $("#fb-cat");
  if (!sel.options.length) {
    sel.innerHTML = Object.keys(F_CATS).map(code => `<option value="${code}">${code} · ${F_CATS[code].kr}</option>`).join("");
    fPopulateBackfillMoves();
    sel.addEventListener("change", fPopulateBackfillMoves);
    $("#fb-date").value = fTodayKey();
  }
}
function fPopulateBackfillMoves() {
  const cat = $("#fb-cat").value;
  const moves = F_POOL.filter(m => m.cat === cat);
  $("#fb-move").innerHTML = moves.map((m,i) => `<option value="${i}">${m.name}</option>`).join("");
}
function fOpenEntryForm(entryId) {
  fEditingId = entryId || null;
  $("#f-backfill-body").classList.remove("hidden");
  $("#f-backfill-chevron").classList.add("open");
  if (fEditingId) {
    const entry = fState.history.find(h => h.id === fEditingId);
    if (!entry) { fCloseBackfill(); return; }
    $("#fb-date").value = entry.date;
    $("#fb-cat").value = entry.cat;
    fPopulateBackfillMoves();
    const moves = F_POOL.filter(m => m.cat === entry.cat);
    const idx = moves.findIndex(m => m.name === entry.name);
    $("#fb-move").value = idx >= 0 ? idx : 0;
    $("#fb-link").value = entry.link || "";
    $("#fb-memo").value = entry.memo || "";
    $("#fb-save").textContent = "수정 저장";
    $("#fb-delete").classList.remove("hidden");
    $("#f-backfill-label").textContent = "기록 수정 중";
  } else {
    $("#fb-date").value = fTodayKey();
    $("#fb-link").value = "";
    $("#fb-memo").value = "";
    $("#fb-save").textContent = "이 날짜로 기록 저장";
    $("#fb-delete").classList.add("hidden");
    $("#f-backfill-label").textContent = "+ 지난 기록 추가";
  }
}
function fCloseBackfill() {
  fEditingId = null;
  $("#f-backfill-body").classList.add("hidden");
  $("#f-backfill-chevron").classList.remove("open");
  $("#f-backfill-label").textContent = "+ 지난 기록 추가";
  $("#fb-delete").classList.add("hidden");
  $("#fb-save").textContent = "이 날짜로 기록 저장";
}
function fSaveBackfill() {
  const date = $("#fb-date").value;
  if (!date) { alert("날짜를 선택해주세요."); return; }
  const cat = $("#fb-cat").value;
  const moves = F_POOL.filter(m => m.cat === cat);
  const move = moves[Number($("#fb-move").value)];
  if (!move) { alert("기술을 선택해주세요."); return; }
  const link = $("#fb-link").value.trim();
  const memo = $("#fb-memo").value.trim();
  if (fEditingId) {
    fState.history = fState.history.map(h => h.id === fEditingId ? { ...h, date, cat: move.cat, name: move.name, link, memo, updated: Date.now() } : h);
  } else {
    fState.history.push({ id: fGenId(), date, cat: move.cat, name: move.name, link, memo, updated: Date.now() });
  }
  fState.history.sort((a,b) => a.date < b.date ? -1 : 1);
  fSave();
  renderFortuneStats();
  renderFortuneLog();
  fCloseBackfill();
}
function fDeleteBackfillEntry() {
  if (!fEditingId) return;
  if (!confirm("이 기록을 삭제할까요?")) return;
  tombAdd("fortune", fEditingId);
  fState.history = fState.history.filter(h => h.id !== fEditingId);
  fSave();
  renderFortuneStats();
  renderFortuneLog();
  fCloseBackfill();
}
function fCollectNote() {
  return { link: $("#f-link").value.trim(), memo: $("#f-memo").value.trim() };
}
function fClearNote() {
  $("#f-link").value = "";
  $("#f-memo").value = "";
}
function fMarkDone(note) {
  if (fState.today.done) return;
  fState.today.done = true;
  const m = fState.today.move;
  fState.history.push({ id: fGenId(), date: fState.today.date, cat: m.cat, name: m.name, link: (note&&note.link)||"", memo: (note&&note.memo)||"", updated: Date.now() });
  fSave();
  renderFortuneCard();
  renderFortuneStats();
  renderFortuneLog();
}
function fLogReviewOnly() {
  const m = fState.today.move;
  const note = fCollectNote();
  if (!note.link && !note.memo) { alert("링크나 메모 중 하나는 입력해주세요."); return; }
  fState.history.push({ id: fGenId(), date: fState.today.date, cat: m.cat, name: m.name, link: note.link, memo: note.memo, updated: Date.now() });
  fSave();
  renderFortuneStats();
  renderFortuneLog();
  fClearNote();
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function migrateEntry(e) {
  if (!e.types || !Array.isArray(e.types)) {
    const map = {
      "technique": ["technique"],
      "sparring": ["mma_sparring"],
      "conditioning": ["conditioning"],
      "flexibility": ["flexibility"],
      "mixed": ["technique", "conditioning"]
    };
    e = { ...e, types: map[e.type] || ["technique"] };
  }
  // 기존에 라운드만 적혀 있던 기록은 자동으로 1타임으로 잡음
  if (Number(e.mma_rounds || 0) > 0 && e.mma_sessions == null) e.mma_sessions = 1;
  if (Number(e.grappling_rounds || 0) > 0 && e.grappling_sessions == null) e.grappling_sessions = 1;
  // 동기화 충돌 판정용 타임스탬프
  if (!e.updated) e.updated = Number(e.id) || 1;
  return e;
}
function loadEntries() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    state.entries = raw.map(migrateEntry);
  }
  catch (e) { state.entries = []; }
}
function saveEntries() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.entries)); syncSoon(); }

/* ===== 동기화 (Cloudflare Worker + KV) ===== */
const SYNC_CFG_KEY = "mma:sync:cfg";
const TOMB_KEY = "mma:tomb:v1";
let syncCfg = { url: "", token: "" };
let tombs = { entries: [], fortune: [] };
let syncTimer = null;
let syncing = false;

function syncLoadCfg() {
  try { syncCfg = { url: "", token: "", ...(JSON.parse(localStorage.getItem(SYNC_CFG_KEY)) || {}) }; }
  catch (e) { syncCfg = { url: "", token: "" }; }
  try { tombs = { entries: [], fortune: [], ...(JSON.parse(localStorage.getItem(TOMB_KEY)) || {}) }; }
  catch (e) { tombs = { entries: [], fortune: [] }; }
}
function syncSaveCfg() { localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(syncCfg)); }
function tombSave() { localStorage.setItem(TOMB_KEY, JSON.stringify(tombs)); }
function tombAdd(kind, id) {
  tombs[kind] = (tombs[kind] || []).filter(t => String(t.id) !== String(id));
  tombs[kind].push({ id: String(id), at: Date.now() });
  tombSave();
}
function syncEnabled() { return !!(syncCfg.url && syncCfg.token); }
function syncStatus(msg, cls) {
  const el = $("#sync-status");
  el.textContent = msg || "";
  el.className = "sync-status" + (cls ? " " + cls : "");
}

function mergeById(localArr, remoteArr, tombList) {
  const map = new Map();
  for (const it of (localArr || [])) map.set(String(it.id), it);
  for (const it of (remoteArr || [])) {
    const k = String(it.id);
    const cur = map.get(k);
    if (!cur || (it.updated || 0) > (cur.updated || 0)) map.set(k, it);
  }
  const tombMap = new Map((tombList || []).map(t => [String(t.id), t.at || 0]));
  return [...map.values()].filter(it => {
    const at = tombMap.get(String(it.id));
    return !(at && at >= (it.updated || 0));
  });
}

function mergeTombs(a, b) {
  const map = new Map();
  for (const t of [...(a || []), ...(b || [])]) {
    const k = String(t.id);
    if (!map.has(k) || (t.at || 0) > map.get(k).at) map.set(k, { id: k, at: t.at || 0 });
  }
  // 오래된 삭제 기록은 90일 후 정리
  const cutoff = Date.now() - 90 * 24 * 3600 * 1000;
  return [...map.values()].filter(t => t.at >= cutoff);
}

function syncSoon() {
  if (!syncEnabled()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(true), 1500);
}

async function syncNow(quiet) {
  if (!syncEnabled()) { if (!quiet) syncStatus("동기화 설정이 필요합니다", "err"); return; }
  if (syncing) return;
  syncing = true;
  syncStatus("동기화 중…", "busy");
  const base = syncCfg.url.replace(/\/+$/, "");
  const headers = { "Content-Type": "application/json", "X-Auth-Token": syncCfg.token };
  try {
    const res = await fetch(base + "/data", { headers });
    if (!res.ok) throw new Error(res.status === 401 ? "토큰이 맞지 않습니다" : "서버 응답 " + res.status);
    const remote = await res.json();

    const mergedTombEntries = mergeTombs(tombs.entries, remote.tombs && remote.tombs.entries);
    const mergedTombFortune = mergeTombs(tombs.fortune, remote.tombs && remote.tombs.fortune);

    const mergedEntries = mergeById(state.entries, remote.entries, mergedTombEntries)
      .sort((a, b) => a.date < b.date ? 1 : -1);

    const rf = remote.fortune || {};
    const mergedHistory = mergeById(fState.history, rf.history, mergedTombFortune)
      .sort((a, b) => a.date < b.date ? -1 : 1);

    // 오늘 뽑은 기술·선택한 파트는 더 최근에 저장된 쪽을 따름
    const localFortuneAt = Number(localStorage.getItem("mma:fortune:at") || 0);
    const remoteAt = Number(remote.updatedAt || 0);
    const takeRemoteMeta = remoteAt > localFortuneAt && rf.today;

    state.entries = mergedEntries;
    fState.history = mergedHistory;
    if (takeRemoteMeta) {
      if (Array.isArray(rf.cats) && rf.cats.length) fState.cats = rf.cats.filter(c => F_CATS[c]);
      if (rf.today) fState.today = rf.today;
    }
    tombs = { entries: mergedTombEntries, fortune: mergedTombFortune };
    tombSave();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.entries));
    localStorage.setItem(FORTUNE_KEY, JSON.stringify(fState));

    const payload = {
      entries: state.entries,
      fortune: { cats: fState.cats, history: fState.history, today: fState.today },
      tombs: tombs,
    };
    const put = await fetch(base + "/data", { method: "PUT", headers, body: JSON.stringify(payload) });
    if (!put.ok) throw new Error("저장 실패 " + put.status);
    const putRes = await put.json();
    localStorage.setItem("mma:fortune:at", String(putRes.updatedAt || Date.now()));

    renderStats(); renderMonthly(); renderFilters(); renderClassFilters(); renderEntries();
    if (state.view === "calendar") renderCalendar();
    if (state.view === "fortune") renderFortune();

    const t = new Date();
    syncStatus(`동기화 완료 · ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`, "ok");
  } catch (e) {
    syncStatus("동기화 실패: " + e.message, "err");
  } finally {
    syncing = false;
  }
}
function typeMeta(id) { return TRAINING_TYPES.find(t => t.id === id) || TRAINING_TYPES[0]; }
function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function renderStats() {
  const total = state.entries.length;
  const mmaTaimTotal = state.entries.reduce((s,e) => s + Number(e.mma_sessions || 0), 0);
  const mmaRoundsTotal = state.entries.reduce((s,e) => s + Number(e.mma_rounds || 0), 0);
  const grapplingTaimTotal = state.entries.reduce((s,e) => s + Number(e.grappling_sessions || 0), 0);
  const grapplingRoundsTotal = state.entries.reduce((s,e) => s + Number(e.grappling_rounds || 0), 0);
  const avgCardio = total ? (state.entries.reduce((s,e) => s + Number(e.cardio||0), 0) / total).toFixed(1) : "—";
  const now = new Date();
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - now.getDay());
  weekStart.setHours(0,0,0,0);
  const thisWeek = state.entries.filter(e => new Date(e.date) >= weekStart).length;

  $("#stats").innerHTML = `
    <div class="stat-card"><div class="stat-label">총 세션</div><div class="stat-value">${total}</div></div>
    <div class="stat-card accent"><div class="stat-label">이번 주</div><div class="stat-value">${thisWeek}</div></div>
    <div class="stat-card"><div class="stat-label">MMA 스파링</div><div class="stat-value">${mmaRoundsTotal}<span class="stat-suffix">판 · ${mmaTaimTotal}타임</span></div></div>
    <div class="stat-card"><div class="stat-label">레슬링/주짓수</div><div class="stat-value">${grapplingRoundsTotal}<span class="stat-suffix">판 · ${grapplingTaimTotal}타임</span></div></div>
    <div class="stat-card"><div class="stat-label">평균 카디오</div><div class="stat-value">${avgCardio}<span class="stat-suffix">/10</span></div></div>`;
  $("#entry-count").textContent = total;
}

function renderMonthly() {
  const groups = {};
  for (const e of state.entries) {
    const ym = (e.date || "").slice(0, 7);
    if (!ym) continue;
    (groups[ym] = groups[ym] || []).push(e);
  }
  const months = Object.keys(groups).sort().reverse();
  if (months.length === 0) { $("#monthly").style.display = "none"; return; }
  $("#monthly").style.display = "block";

  $("#monthly-body").innerHTML = `<div class="month-grid">${months.map(ym => {
    const items = groups[ym];
    const n = items.length;
    const avgCardio = (items.reduce((s,e) => s + Number(e.cardio||0), 0) / n).toFixed(1);
    const avgCondition = (items.reduce((s,e) => s + Number(e.condition||0), 0) / n).toFixed(1);
    const mmaTaim = items.reduce((s,e) => s + Number(e.mma_sessions||0), 0);
    const mmaRounds = items.reduce((s,e) => s + Number(e.mma_rounds||0), 0);
    const grapTaim = items.reduce((s,e) => s + Number(e.grappling_sessions||0), 0);
    const grapRounds = items.reduce((s,e) => s + Number(e.grappling_rounds||0), 0);
    const [y, m] = ym.split("-");
    return `<div class="month-card">
      <div class="month-card-top">
        <span class="month-name">${y}년 ${Number(m)}월</span>
        <span class="month-sessions">${n}세션</span>
      </div>
      <div class="month-metrics">
        <div class="month-metric"><div class="month-metric-label">평균 카디오</div><div class="month-metric-value">${avgCardio}<span class="unit"> /10</span></div></div>
        <div class="month-metric"><div class="month-metric-label">평균 컨디션</div><div class="month-metric-value">${avgCondition}<span class="unit"> /10</span></div></div>
        <div class="month-metric"><div class="month-metric-label">MMA 스파링</div><div class="month-metric-value">${mmaRounds}<span class="unit">판 · ${mmaTaim}타임</span></div></div>
        <div class="month-metric"><div class="month-metric-label">레슬링/주짓수</div><div class="month-metric-value">${grapRounds}<span class="unit">판 · ${grapTaim}타임</span></div></div>
      </div>
    </div>`;
  }).join("")}</div>`;
}

function setView(view) {
  state.view = view;
  $$(".view-btn").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  const calendar = view === "calendar";
  const fortune = view === "fortune";
  $("#calendar").style.display = calendar ? "block" : "none";
  $("#fortune-view").style.display = fortune ? "block" : "none";
  $("#filters").style.display = (calendar || fortune) ? "none" : "flex";
  $("#class-filters").style.display = (calendar || fortune) ? "none" : "flex";
  $("#content").style.display = (calendar || fortune) ? "none" : "block";
  $("#monthly").style.display = fortune ? "none" : (state.entries.length ? "block" : "none");
  if (calendar) renderCalendar();
  if (fortune) renderFortune();
}

function renderCalendar() {
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  $("#cal-title").textContent = `${year}년 ${month+1}월`;

  const byDate = {};
  for (const e of state.entries) (byDate[e.date] = byDate[e.date] || []).push(e);

  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayString = todayStr();

  let cells = "";
  for (let i = 0; i < firstWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dayEntries = byDate[dateStr] || [];
    const has = dayEntries.length > 0;
    const isToday = dateStr === todayString;
    const allTypes = [...new Set(dayEntries.flatMap(e => e.types || []))];
    const dots = allTypes.slice(0,4).map(t => `<span class="cal-dot ${typeMeta(t).color}"></span>`).join("");
    cells += `<div class="cal-cell ${has?'has-entry':''} ${isToday?'today':''}" ${has?`data-date="${dateStr}"`:''}>
      <span>${d}</span>
      ${dots ? `<div class="cal-dots">${dots}</div>` : ''}
    </div>`;
  }
  $("#cal-grid").innerHTML = cells;
  $("#cal-legend").innerHTML = TRAINING_TYPES.map(t =>
    `<span class="cal-legend-item"><span class="cal-dot ${t.color}"></span>${t.label}</span>`
  ).join("");

  $$("#cal-grid .cal-cell.has-entry").forEach(cell => {
    cell.addEventListener("click", () => {
      const dayEntries = state.entries.filter(e => e.date === cell.dataset.date);
      if (dayEntries.length) openEdit(dayEntries[0].id);
    });
  });
}

function renderClassFilters() {
  let html = `<button class="filter-chip ${state.classFilter==='all'?'active':''}" data-cfilter="all">수업: 전체</button>`;
  for (const c of CLASS_TYPES) {
    html += `<button class="filter-chip ${state.classFilter===c.id?'active':''}" data-cfilter="${c.id}"><span class="filter-dot ${c.color}"></span>${c.label}</button>`;
  }
  $("#class-filters").innerHTML = html;
  $$("#class-filters .filter-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      state.classFilter = btn.dataset.cfilter;
      renderClassFilters();
      renderEntries();
    });
  });
}

function renderFilters() {
  let html = `<button class="filter-chip ${state.filter==='all'?'active':''}" data-filter="all">전체</button>`;
  for (const t of TRAINING_TYPES) {
    html += `<button class="filter-chip ${state.filter===t.id?'active':''}" data-filter="${t.id}"><span class="filter-dot ${t.color}"></span>${t.label}</button>`;
  }
  $("#filters").innerHTML = html;
  $$("#filters .filter-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      state.filter = btn.dataset.filter;
      renderFilters();
      renderEntries();
    });
  });
}

function renderEntries() {
  let filtered = state.filter === "all" ? state.entries : state.entries.filter(e => e.types.includes(state.filter));
  filtered = state.classFilter === "all" ? filtered : filtered.filter(e => e.classType === state.classFilter);
  if (filtered.length === 0) {
    const hasAny = state.entries.length > 0;
    $("#content").innerHTML = `
      <div class="empty">
        <div class="empty-title">${hasAny ? "이 유형의 기록 없음" : "첫 기록을 남겨보세요"}</div>
        <p class="empty-text">${hasAny ? "필터를 바꿔보거나 새로 추가하세요" : "오늘 훈련부터 차곡차곡"}</p>
        <button class="btn-primary" id="empty-add">+ 기록 추가</button>
      </div>`;
    $("#empty-add").addEventListener("click", openNew);
    return;
  }
  const sorted = [...filtered].sort((a,b) => a.date < b.date ? 1 : -1);
  const days = ["일","월","화","수","목","금","토"];
  $("#content").innerHTML = `<ul class="entries">${sorted.map(entry => {
    const d = new Date(entry.date);
    const badges = entry.types.map(t => { const m = typeMeta(t); return `<span class="type-badge ${m.color}">${m.label}</span>`; }).join("");
    const classMeta = entry.classType ? CLASS_TYPES.find(c => c.id === entry.classType) : null;
    const classBadge = classMeta ? `<span class="type-badge ${classMeta.color}">${classMeta.label}</span>` : "";
    const roundsBits = [];
    if (entry.types.includes("mma_sparring") && (entry.mma_rounds || entry.mma_sessions)) {
      const t = entry.mma_sessions || 0, r = entry.mma_rounds || 0;
      const focusMeta = entry.mma_focus ? MMA_FOCUS.find(f => f.id === entry.mma_focus) : null;
      const modeMeta = entry.sparring_mode ? SPARRING_MODE.find(m => m.id === entry.sparring_mode) : null;
      const tagBits = [focusMeta && focusMeta.label, modeMeta && modeMeta.label].filter(Boolean);
      const focusStr = tagBits.length ? ` (${tagBits.join(" · ")})` : "";
      roundsBits.push(t > 1 ? `MMA ${t}타임 ${r}판${focusStr}` : `MMA ${r}판${focusStr}`);
    }
    if (entry.types.includes("grappling") && (entry.grappling_rounds || entry.grappling_sessions)) {
      const t = entry.grappling_sessions || 0, r = entry.grappling_rounds || 0;
      roundsBits.push(t > 1 ? `그래플 ${t}타임 ${r}판` : `그래플 ${r}판`);
    }
    const roundsHtml = roundsBits.length ? `<span class="font-mono" style="font-size:0.75rem;color:var(--accent-bright)">· ${roundsBits.join(" · ")}</span>` : "";
    const hasDetail = !!(entry.techniques || entry.reflection);
    const detailHtml = hasDetail ? `
        <span class="entry-toggle" data-id="${entry.id}">▼ 상세보기</span>
        <div class="entry-detail" id="detail-${entry.id}">
          ${entry.techniques ? `<p class="entry-tech">${escapeHtml(entry.techniques)}</p>` : ""}
          ${entry.reflection ? `<p class="entry-reflection">— ${escapeHtml(entry.reflection)}</p>` : ""}
        </div>` : "";
    return `<li class="entry">
      <div class="entry-date">
        <div class="entry-date-num">${d.getMonth()+1}.${String(d.getDate()).padStart(2,"0")}</div>
        <div class="entry-date-day">${days[d.getDay()]}요일</div>
      </div>
      <div class="entry-content">
        <div class="entry-meta">
          ${classBadge}
          ${badges}
          <span class="font-mono" style="font-size:0.75rem;color:var(--text-dimmer)">${entry.duration}분</span>
          ${roundsHtml}
          ${entry.weight ? `<span class="font-mono" style="font-size:0.75rem;color:var(--text-dimmer)">· ${entry.weight}kg</span>` : ""}
          <div class="entry-stats">
            <span>심폐 <span>${entry.cardio}</span>/10</span>
            <span>회복 <span>${entry.condition}</span>/10</span>
          </div>
        </div>
        ${detailHtml}
      </div>
      <div class="entry-actions">
        <button class="entry-action-btn edit" data-id="${entry.id}">수정</button>
        <button class="entry-action-btn delete" data-id="${entry.id}">삭제</button>
      </div>
    </li>`;
  }).join("")}</ul>`;

  $$(".entry-action-btn.edit").forEach(btn => btn.addEventListener("click", () => openEdit(Number(btn.dataset.id))));
  $$(".entry-action-btn.delete").forEach(btn => btn.addEventListener("click", () => deleteEntry(Number(btn.dataset.id))));
  $$(".entry-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const detail = $("#detail-" + btn.dataset.id);
      const open = detail.classList.toggle("open");
      btn.textContent = open ? "▲ 접기" : "▼ 상세보기";
    });
  });
}

}

}

function renderTypeGrid() {
  $("#type-grid").innerHTML = TRAINING_TYPES.map(t =>
    `<button class="type-btn ${state.formTypes.includes(t.id)?'active '+t.color:''}" data-type="${t.id}">${t.label}</button>`
  ).join("");
  $$("#type-grid .type-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.type;
      if (state.formTypes.includes(id)) {
        if (state.formTypes.length > 1) state.formTypes = state.formTypes.filter(t => t !== id);
      } else {
        state.formTypes = [...state.formTypes, id];
      }
      renderTypeGrid();
      updateRoundsFields();
    });
  });
  updateRoundsFields();
}

function openNew() {
  state.editingId = null;
  state.formTypes = ["technique"];
  state.formClass = null;
  state.formMmaFocus = null;
  state.formSparringMode = null;
  $("#modal-title").textContent = "오늘의 훈련";
  $("#save-btn").textContent = "기록 저장";
  $("#f-date").value = todayStr();
  $("#f-duration").value = 90;
  $("#f-cardio").value = 6; $("#cardio-display").textContent = 6;
  $("#f-condition").value = 7; $("#condition-display").textContent = 7;
  $("#f-weight").value = "";
  $("#f-mma-sessions").value = "";
  $("#f-mma-rounds").value = "";
  $("#f-grappling-sessions").value = "";
  $("#f-grappling-rounds").value = "";
  $("#f-techniques").value = "";
  $("#f-reflection").value = "";
  renderTypeGrid();
  renderClassGrid();
  renderMmaFocusGrid();
  renderSparringModeGrid();
  $("#modal").classList.remove("hidden");
}

function openEdit(id) {
  const entry = state.entries.find(e => e.id === id);
  if (!entry) return;
  state.editingId = id;
  state.formTypes = [...entry.types];
  state.formClass = entry.classType || null;
  state.formMmaFocus = entry.mma_focus || null;
  state.formSparringMode = entry.sparring_mode || null;
  $("#modal-title").textContent = "기록 수정";
  $("#save-btn").textContent = "수정 완료";
  $("#f-date").value = entry.date;
  $("#f-duration").value = entry.duration;
  $("#f-cardio").value = entry.cardio; $("#cardio-display").textContent = entry.cardio;
  $("#f-condition").value = entry.condition; $("#condition-display").textContent = entry.condition;
  $("#f-weight").value = entry.weight || "";
  $("#f-mma-sessions").value = entry.mma_sessions || "";
  $("#f-mma-rounds").value = entry.mma_rounds || "";
  $("#f-grappling-sessions").value = entry.grappling_sessions || "";
  $("#f-grappling-rounds").value = entry.grappling_rounds || "";
  $("#f-techniques").value = entry.techniques || "";
  $("#f-reflection").value = entry.reflection || "";
  renderTypeGrid();
  renderClassGrid();
  renderMmaFocusGrid();
  renderSparringModeGrid();
  $("#modal").classList.remove("hidden");
}

function closeModal() { $("#modal").classList.add("hidden"); }

function saveCurrent() {
  const date = $("#f-date").value;
  const duration = Number($("#f-duration").value);
  if (!date) { alert("날짜를 입력해주세요"); return; }
  if (!duration || duration <= 0) { alert("훈련 시간을 입력해주세요"); return; }

  const data = {
    date, types: [...state.formTypes], classType: state.formClass, duration,
    cardio: Number($("#f-cardio").value),
    condition: Number($("#f-condition").value),
    weight: $("#f-weight").value || "",
    mma_sessions: state.formTypes.includes("mma_sparring") ? (Number($("#f-mma-sessions").value) || 0) : 0,
    mma_rounds: state.formTypes.includes("mma_sparring") ? (Number($("#f-mma-rounds").value) || 0) : 0,
    mma_focus: state.formTypes.includes("mma_sparring") ? state.formMmaFocus : null,
    sparring_mode: state.formTypes.includes("mma_sparring") ? state.formSparringMode : null,
    grappling_sessions: state.formTypes.includes("grappling") ? (Number($("#f-grappling-sessions").value) || 0) : 0,
    grappling_rounds: state.formTypes.includes("grappling") ? (Number($("#f-grappling-rounds").value) || 0) : 0,
    techniques: $("#f-techniques").value,
    reflection: $("#f-reflection").value
  };

  if (state.editingId) {
    state.entries = state.entries.map(e => e.id === state.editingId ? { ...e, ...data, updated: Date.now() } : e);
  } else {
    const now = Date.now();
    state.entries.unshift({ id: now, ...data, updated: now });
  }
  state.entries.sort((a,b) => a.date < b.date ? 1 : -1);
  saveEntries();
  closeModal();
  renderStats();
  renderMonthly();
  renderEntries();
  if (state.view === "calendar") renderCalendar();
}

function deleteEntry(id) {
  if (!confirm("이 기록을 삭제할까요?")) return;
  state.entries = state.entries.filter(e => e.id !== id);
  tombAdd("entries", id);
  saveEntries();
  renderStats();
  renderMonthly();
  renderEntries();
  if (state.view === "calendar") renderCalendar();
}

function exportData() {
  const blob = new Blob([JSON.stringify(state.entries, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `fightlog-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error("invalid");
      const replace = !confirm(`${data.length}개 항목을 가져옵니다.\n\n[확인] 기존 ${state.entries.length}개와 합치기\n[취소] 기존 데이터 덮어쓰기`);
      if (replace) {
        state.entries = data.map(migrateEntry);
      } else {
        const existingIds = new Set(state.entries.map(x => x.id));
        const merged = [...state.entries];
        for (const item of data) if (!existingIds.has(item.id)) merged.push(migrateEntry(item));
        state.entries = merged;
      }
      state.entries.sort((a,b) => a.date < b.date ? 1 : -1);
      saveEntries();
      renderStats();
      renderMonthly();
      renderEntries();
      alert("가져오기 완료");
    } catch (err) {
      alert("올바른 JSON 백업 파일이 아닙니다.");
    }
  };
  reader.readAsText(file);
}

loadEntries();
fLoad();

renderStats();

renderClassFilters();
renderEntries();

  $("#sync-panel").classList.add("hidden");

  if (!confirm("이 기기에서 동기화 연결을 해제할까요? (기록은 남습니다)")) return;

  syncSaveCfg();
  $("#sync-panel").classList.add("hidden");

});

if (syncEnabled()) syncNow(true);
